name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix Gradle wrapper permission
        run: chmod +x gradlew

      - name: Download Gradle distribution
        run: ./gradlew --version || true

      - name: Fix downloaded Gradle permission
        run: |
          find "$HOME/.gradle/wrapper/dists" \
            -type f \
            -path "*/bin/gradle" \
            -exec chmod +x {} \;

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mimore-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error